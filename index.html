<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champions Tracker — Mi Pokédex</title>
<style>
:root{--bg:#0b1020;--panel:#111a2e;--panel2:#17233c;--text:#eef4ff;--muted:#91a1bb;--accent:#55a7ff;--ok:#43d17a;--line:#263652}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182b4c 0,#0b1020 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:28px 18px 18px;max-width:1200px;margin:auto}h1{margin:0;font-size:clamp(26px,5vw,44px)}header p{color:var(--muted);margin:8px 0 0}
.wrap{max-width:1200px;margin:auto;padding:0 18px 40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.stat,.toolbar,.card{background:rgba(17,26,46,.92);border:1px solid var(--line);border-radius:18px}
.stat{padding:16px}.stat b{font-size:25px;display:block}.stat span{color:var(--muted);font-size:13px}
.progress{height:9px;background:#202d45;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:.25s}
.toolbar{padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,button{background:#0c1527;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit}
input{flex:1;min-width:190px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.danger{color:#ff9b9b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.card{padding:14px;position:relative;transition:.2s}.card.caught{border-color:var(--ok);background:linear-gradient(145deg,rgba(25,74,50,.92),rgba(17,26,46,.96));box-shadow:0 0 18px rgba(67,209,122,.22),0 0 0 1px rgba(67,209,122,.35)}.card.missing{border-color:#ff5353;background:linear-gradient(145deg,rgba(91,29,36,.92),rgba(17,26,46,.96));box-shadow:0 0 18px rgba(255,83,83,.20),0 0 0 1px rgba(255,83,83,.35)}
.top{display:flex;align-items:center;gap:12px}.sprite{width:82px;height:82px;image-rendering:auto;background:#0c1527;border-radius:15px}
.num{color:var(--muted);font-size:12px}h3{margin:2px 0 8px;font-size:19px}label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}
.ballrow{display:flex;align-items:center;gap:8px}.ball{width:27px;height:27px;object-fit:contain}
.status{display:flex;align-items:center;gap:8px;margin-top:10px}.status input{min-width:0;flex:0;width:18px;height:18px}
.empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:11px}.sprite{width:65px;height:65px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🎒 Champions Tracker</h1><p>Tu Pokédex personal: captura, Poké Ball y progreso.</p><p style="margin-top:10px;color:#55a7ff;font-weight:700">Creado por Grymmerr</p></header>
<div class="wrap">
<section class="stats">
 <div class="stat"><b id="caught">0</b><span>Capturados</span></div>
 <div class="stat"><b id="total">208</b><span>Pokémon registrados</span></div>
 <div class="stat"><b id="percent">0%</b><span>Progreso</span></div>
 <div class="stat"><b id="balls">0</b><span>Poké Balls asignadas</span></div>
</section>
<div class="progress"><i id="bar"></i></div>
<div class="toolbar">
 <input id="search" placeholder="🔎 Buscar Pokémon..." autocomplete="off">
 <select id="filter">
   <option value="all">📋 Todos</option>
   <option value="caught">✅ Los tengo</option>
   <option value="missing">❌ Me faltan</option>
 </select>
 <select id="sort"><option value="dex">N.º Pokédex</option><option value="az">A → Z</option><option value="za">Z → A</option></select>
 <button id="export">⬇️ Exportar</button><button id="shareImage">🖼️ Compartir los que me faltan</button><button id="sharePage">🔗 Compartir página</button><button id="importBtn">⬆️ Importar</button>
 <button class="danger" id="reset">🗑️ Borrar progreso</button>
 <input id="file" type="file" accept=".json" hidden>
</div>
<div style="margin:0 0 14px;color:var(--muted);font-size:13px">
  💡 Usa <b style="color:var(--text)">"Los tengo"</b> para ver tus capturados y <b style="color:var(--text)">"Me faltan"</b> para ver lo que todavía necesitas.
</div>
<div id="grid" class="grid"></div>
</div>
<script>
const POKEMON=[{"id":3,"name":"Venusaur"},{"id":6,"name":"Charizard"},{"id":9,"name":"Blastoise"},{"id":15,"name":"Beedrill"},{"id":18,"name":"Pidgeot"},{"id":24,"name":"Arbok"},{"id":25,"name":"Pikachu"},{"id":26,"name":"Raichu"},{"id":36,"name":"Clefable"},{"id":38,"name":"Ninetales"},{"id":45,"name":"Vileplume"},{"id":59,"name":"Arcanine"},{"id":65,"name":"Alakazam"},{"id":68,"name":"Machamp"},{"id":71,"name":"Victreebel"},{"id":80,"name":"Slowbro"},{"id":94,"name":"Gengar"},{"id":115,"name":"Kangaskhan"},{"id":121,"name":"Starmie"},{"id":127,"name":"Pinsir"},{"id":128,"name":"Tauros"},{"id":130,"name":"Gyarados"},{"id":132,"name":"Ditto"},{"id":134,"name":"Vaporeon"},{"id":135,"name":"Jolteon"},{"id":136,"name":"Flareon"},{"id":142,"name":"Aerodactyl"},{"id":143,"name":"Snorlax"},{"id":149,"name":"Dragonite"},{"id":154,"name":"Meganium"},{"id":157,"name":"Typhlosion"},{"id":160,"name":"Feraligatr"},{"id":168,"name":"Ariados"},{"id":181,"name":"Ampharos"},{"id":184,"name":"Azumarill"},{"id":186,"name":"Politoed"},{"id":196,"name":"Espeon"},{"id":197,"name":"Umbreon"},{"id":199,"name":"Slowking"},{"id":205,"name":"Forretress"},{"id":208,"name":"Steelix"},{"id":211,"name":"Qwilfish"},{"id":212,"name":"Scizor"},{"id":214,"name":"Heracross"},{"id":227,"name":"Skarmory"},{"id":229,"name":"Houndoom"},{"id":248,"name":"Tyranitar"},{"id":254,"name":"Sceptile"},{"id":257,"name":"Blaziken"},{"id":260,"name":"Swampert"},{"id":279,"name":"Pelipper"},{"id":282,"name":"Gardevoir"},{"id":302,"name":"Sableye"},{"id":303,"name":"Mawile"},{"id":306,"name":"Aggron"},{"id":308,"name":"Medicham"},{"id":310,"name":"Manectric"},{"id":319,"name":"Sharpedo"},{"id":323,"name":"Camerupt"},{"id":324,"name":"Torkoal"},{"id":334,"name":"Altaria"},{"id":350,"name":"Milotic"},{"id":351,"name":"Castform"},{"id":354,"name":"Banette"},{"id":358,"name":"Chimecho"},{"id":359,"name":"Absol"},{"id":362,"name":"Glalie"},{"id":376,"name":"Metagross"},{"id":389,"name":"Torterra"},{"id":392,"name":"Infern "name":"Archaludon"},{"id":1019,"name":"Hydrapple"}];
const BALLS=[
 ["","Sin asignar",""],
 ["poke","Poké Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png"],
 ["great","Super Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/great-ball.png"],
 ["ultra","Ultra Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/ultra-ball.png"],
 ["premier","Honor Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/premier-ball.png"],
 ["luxury","Lujo Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/luxury-ball.png"],
 ["dusk","Ocaso Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/dusk-ball.png"],
 ["quick","Veloz Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/quick-ball.png"],
 ["timer","Turno Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/timer-ball.png"],
 ["repeat","Acopio Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/repeat-ball.png"],
 ["net","Malla Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/net-ball.png"],
 ["dive","Buceo Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/dive-ball.png"],
 ["heal","Sana Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/heal-ball.png"],
 ["nest","Nido Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/nest-ball.png"],
 ["friend","Amigo Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/friend-ball.png"],
 ["fast","Rapid Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/fast-ball.png"],
 ["level","Nivel Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/level-ball.png"],
 ["love","Amor Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/love-ball.png"],
 ["moon","Luna Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/moon-ball.png"],
 ["heavy","Peso Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/heavy-ball.png"],
 ["beast","Ente Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/beast-ball.png"],
 ["dream","Ensueño Ball","https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/dream-ball.png"]
];
let state=JSON.parse(localStorage.getItem("championsTracker")||"{}");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const key=id=>String(id);
function getState(id){ return state[key(id)] || {caught:null,ball:""}; }
function save(){localStorage.setItem("championsTracker",JSON.stringify(state));updateStats();}
function sprite(id){return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;}
function render(){
 let q=document.getElementById("search").value.toLowerCase().trim(), f=document.getElementById("filter").value, s=document.getElementById("sort").value;
 let arr=POKEMON.filter(p=>p.name.toLowerCase().includes(q)||String(p.id).includes(q));
 arr=arr.filter(p=>f==="all"||(f==="caught"&&state[key(p.id)]?.caught===true)||(f==="missing"&&state[key(p.id)]?.caught===false));
 arr.sort((a,b)=>s==="az"?a.name.localeCompare(b.name):s==="za"?b.name.localeCompare(a.name):a.id-b.id);
 const grid=document.getElementById("grid");
 if(!arr.length){grid.innerHTML='<div class="empty">No se encontraron Pokémon.</div>';return;}
 grid.innerHTML=arr.map(p=>{
   const st=state[key(p.id)]||{caught:false,ball:""};
   return `<article class="card ${st.caught?'caught':''}">
    <div class="top"><img class="sprite" loading="lazy" src="${sprite(p.id)}" onerror="this.style.visibility='hidden'"><div><div class="num">#${String(p.id).padStart(4,"0")}</div><h3>${esc(p.name)}</h3></div></div>
    <label>Poké Ball</label>
    <div class="ballrow"><img class="ball" src="${BALLS.find(b=>b[0]===st.ball)?.[2]||''}" onerror="this.style.display='none'">
    <select data-ball="${p.id}">${BALLS.map(b=>`<option value="${b[0]}" ${st.ball===b[0]?'selected':''}>${b[1]}</option>`).join("")}</select></div>
    <label>Estado de captura</label>
    <div class="capture-options">
      <button type="button" class="capture-btn ${st.caught===true?'active yes':''}" data-set-caught="${p.id}" data-value="yes">✅ Lo tengo</button>
      <button type="button" class="capture-btn ${st.caught===false?'active no':''}" data-set-caught="${p.id}" data-value="no">❌ No lo tengo</button>
    </div>
   </article>`;
 }).join("");
 grid.querySelectorAll("[data-ball]").forEach(el=>el.onchange=e=>{let id=e.target.dataset.ball;state[id]={...(state[id]||{}),ball:e.target.value};save();render();});
 grid.querySelectorAll("[data-set-caught]").forEach(el=>el.onclick=e=>{let id=e.currentTarget.dataset.setCaught;let value=e.currentTarget.dataset.value==="yes";state[id]={...(state[id]||{}),caught:value};save();render();});
}

async function sharePage(){
  const title="Pokémon Champions Tracker — Creado por Grymmerr";
  const text="🎒 Usa mi Pokémon Champions Tracker para llevar tu colección.";
  const url=location.href;

  try{
    if(navigator.share){
      await navigator.share({title,text,url});
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(url);
      alert("🔗 Enlace copiado. Ya puedes compartirlo con otras personas.");
    }else{
      prompt("Copia este enlace para compartir la página:",url);
    }
  }catch(e){}
}
document.getElementById("sharePage").onclick=sharePage;

function shareCollectionImage(){
  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
  const missing=POKEMON.filter(p=>state[key(p.id)]?.caught===false);
  const W=1200,pad=45,cardW=340,cardH=150,gap=18,cols=3;
  const rows=Math.max(1,Math.ceil(missing.length/cols));
  const H=150+rows*(cardH+gap)+70;
  canvas.width=W;canvas.height=H;

  ctx.fillStyle="#0b1020";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#eef4ff";ctx.font="bold 38px system-ui";
  ctx.fillText("❌ Pokémon que me faltan",pad,62);
  ctx.fillStyle="#91a1bb";ctx.font="20px system-ui";
  ctx.fillText(`${missing.length} Pokémon pendientes de capturar`,pad,98);

  const images=missing.map(p=>new Promise(resolve=>{
    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>resolve({p,img});
    img.onerror=()=>resolve({p,img:null});
    img.src=sprite(p.id);
  }));

  Promise.all(images).then(items=>{
    items.forEach(({p,img},i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const x=pad+col*(cardW+gap),y=130+row*(cardH+gap);

      ctx.fillStyle="#5b1d24";ctx.fillRect(x,y,cardW,cardH);
      ctx.strokeStyle="#ff5353";ctx.lineWidth=2;ctx.strokeRect(x,y,cardW,cardH);

      if(img){
        ctx.drawImage(img,x+15,y+18,110,110);
      }

      ctx.fillStyle="#91a1bb";ctx.font="16px system-ui";
      ctx.fillText("#"+String(p.id).padStart(4,"0"),x+140,y+42);
      ctx.fillStyle="#eef4ff";ctx.font="bold 23px system-ui";
      ctx.fillText(p.name,x+140,y+76);

      const st=state[key(p.id)];
      if(st?.ball){
        const ball=BALLS.find(b=>b[0]===st.ball);
        if(ball && ball[2]){
          const bi=new Image();
          bi.crossOrigin="anonymous";
          bi.onload=()=>{
            ctx.drawImage(bi,x+140,y+92,30,30);
            ctx.fillStyle="#91a1bb";ctx.font="14px system-ui";
            ctx.fillText(ball[1],x+178,y+113);
          };
          bi.src=ball[2];
        }
      }
    });

    ctx.fillStyle="#91a1bb";ctx.font="15px system-ui";
    ctx.fillText("Pokémon Champions Tracker",pad,H-28);

    canvas.toBlob(async blob=>{
      if(!blob)return;
      const file=new File([blob],"pokemon-champions-me-faltan.png",{type:"image/png"});
      try{
        if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({
            title:"Pokémon que me faltan",
            text:`Me faltan ${missing.length} Pokémon en Pokémon Champions.`,
            files:[file]
          });
        }else{
          const a=document.createElement("a");
          a.href=URL.createObjectURL(blob);
          a.download=file.name;
          a.click();
          alert("La imagen se generó. Puedes compartirla desde tus descargas.");
        }
      }catch(e){}
    },"image/png");
  });
}
document.getElementById("shareImage").onclick=shareCollectionImage;

function updateStats(){
 let caught=POKEMON.filter(p=>state[key(p.id)]?.caught===true).length, balls=POKEMON.filter(p=>state[key(p.id)]?.ball).length, pct=Math.round(caught/POKEMON.length*100);
 document.getElementById("caught").textContent=caught;document.getElementById("balls").textContent=balls;document.getElementById("percent").textContent=pct+"%";document.getElementById("bar").style.width=pct+"%";
}
["search","filter","sort"].forEach(id=>document.getElementById(id).oninput=render);
document.getElementById("reset").onclick=()=>{if(confirm("¿Borrar todo tu progreso?")){state={};save();render();}};
document.getElementById("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="champions-tracker-progreso.json";a.click();};
document.getElementById("importBtn").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();}catch{alert("Archivo no válido.")}};r.readAsText(file);};
updateStats();render();
</script>
</body></html>
